# Nginx 配置 - blog.hazenix.top
# 预渲染 + SPA 双模 + HTTP/2 + Brotli 静态压缩

# 爬虫 User-Agent 检测
map $http_user_agent $crawler_redirect {
    default         0;
    ~*googlebot     1;
    ~*bingbot       1;
    ~*baiduspider   1;
    ~*yandex        1;
    ~*duckduckbot   1;
    ~*slurp         1;
    ~*twitterbot    1;
    ~*facebookexternalhit 1;
    ~*linkedinbot   1;
}

map $crawler_redirect $crawler_snapshot {
    1       /prerender$uri.html;
    default $uri;
}

map $sent_http_content_type $crawler_vary {
    ~^text/html User-Agent;
    default "";
}

map $request_uri $article_cache_control {
    ~^/article/ "no-store";
    default "";
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name blog.hazenix.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name blog.hazenix.top;

    ssl_certificate     /etc/nginx/ssl/blog.hazenix.top.pem;
    ssl_certificate_key /etc/nginx/ssl/blog.hazenix.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /path/to/frontend/dist;
    index index.html;

    # Brotli 静态压缩：直接返回预生成的 .br 文件，零 CPU 开销
    brotli_static on;
    # Gzip fallback
    gzip_static on;
    gzip_vary on;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location = / {
        try_files /landing.html =404;
    }

    add_header Vary $crawler_vary;
    add_header Cache-Control $article_cache_control always;

    # 检查发布状态后再读取快照。新文章可以先通过 Vue 打开。
    location ^~ /article/ {
        auth_request /_article_page_status;
        error_page 403 =404 /404.html;
        try_files $crawler_snapshot /index.html =404;
    }

    location = /_article_page_status {
        internal;
        proxy_pass http://127.0.0.1:9090/user/articles/page-status;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Article-URI $request_uri;
    }

    location = /api/user/articles/page-status {
        return 404;
    }

    location / {
        try_files $crawler_snapshot $uri $uri/ /index.html =404;
    }

    location = /article {
        error_page 404 =404 /404.html;
        return 404;
    }

    location = /404 {
        error_page 404 =404 /404.html;
        return 404;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:9090/user/articles/sitemap.xml;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 缓存策略 =====
    # JS/CSS（带 hash）长期缓存 + immutable
    location ~* ^/assets/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # 图片/字体/WebP 中期缓存
    location ~* \.(jpg|jpeg|png|gif|svg|ico|webp|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    # 所有文章快照经对应的公开路径访问，统一检查发布状态。
    location ^~ /prerender/ {
        internal;
    }

    # SPA index.html 不缓存
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
